name: Refresh profile cards

on:
  schedule:
    # Every hour, so a newly merged PR shows up within the hour (GitHub can start
    # scheduled runs late). Cards are only committed when something changed.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changed cards
        run: |
          git add assets docs README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile cards"
          git push
